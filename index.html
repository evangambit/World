<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A fantasy top-down world traversal game with multi-elevation terrain, buildings, and NPC pathfinding.">
    <title>World — Fantasy Village</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-content">
            <h1>World</h1>
            <p>Loading...</p>
        </div>
    </div>
    <canvas id="game-canvas" tabindex="0"></canvas>
    <div id="ui-overlay">
        <div class="ui-left-col">
            <div id="layer-indicator">Floor: 0</div>
            <div id="inventory-panel">
                <div id="inventory-label">Inventory</div>
                <div id="inventory-items"></div>
            </div>
            <div id="container-panel" class="hidden">
                <div id="container-title">Storage</div>
                <div id="container-hint">Click item to take · click pack row to store</div>
                <div id="container-items"></div>
            </div>
        </div>
        <div id="controls-hint">WASD · click world to pick up / open storage · click pack to drop · E: doors</div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
